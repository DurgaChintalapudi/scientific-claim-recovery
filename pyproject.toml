[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "scientific-claim-recovery"
version = "0.1.1"
description = "SciFact claim recovery pilot with local Ollama"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pydantic>=2.5"]
[project.optional-dependencies]
test = ["pytest>=7.4"]
[project.scripts]
recovery-pilot = "recovery.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
